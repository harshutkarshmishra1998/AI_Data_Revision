[project]
name = "ai-data-revision"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "dotenv>=0.9.9",
    "langchain>=1.5.0",
    "langchain-community>=0.4.2",
    "langchain-groq>=1.1.3",
    "matplotlib>=3.11.2",
    "openpyxl>=3.1.5",
    "pandas>3",
    "pathlib>=1.0.1",
    "pmdarima>=2.1.1",
    "pyspark>=4.2.0",
    "scikit-learn>=1.9.1",
    "statsmodels>=0.15.0",
]

[project.scripts]
ai-data-revision = "ai_data_revision:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"
